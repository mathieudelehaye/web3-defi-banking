<!DOCTYPE html>
<html>

  <head>
    <title>DBank</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link type="text/css" rel="stylesheet" href="src/main.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico">
  </head>

  <body>
    <div class="container">
      <img src="dbank_logo.png" alt="DBank logo" width="230"/>
      <h1>Current Balance: $<span id="value">234</span></h1>
      <div class="divider"></div>
      <form action="#">
        <h2>Interest Configuration</h2>
        <div class="interest-config">
          <div class="config-row">
            <div class="config-item">
              <label for="interest-rate">Interest Rate (%):</label>
              <input id="interest-rate" type="number" step="0.01" min="0.01" max="100" value="1.00" name="interestRate"/>
            </div>
            <div class="config-item">
              <label for="periodicity">Compounding Period:</label>
              <select id="periodicity" name="periodicity">
                <option value="1">Second</option>
                <option value="10" selected>10 Seconds</option>
                <option value="86400">Day</option>
                <option value="2592000">Month</option>
                <option value="31536000">Year</option>
              </select>
            </div>
          </div>
        </div>

        <h2>Amount to Top Up</h2>
        <input id="input-amount" type="number" step="0.01" min=0 name="topUp" value=""/>
        <h2>Amount to Withdraw</h2>
        <input id="withdrawal-amount" type="number" name="withdraw" step="0.01" min=0 value=""/>
        <input id="submit-btn" type="submit" value="Finalise Transaction" />
      </form>
    </div>
    <footer>
      <p>&copy; 2025 Mathieu Delehaye</p>
    </footer>
    <script type="module" src="src/index.js"></script>
  </body>

</html>
